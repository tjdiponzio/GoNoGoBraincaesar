<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Balloon Analog Risk Task (BART)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Prevent double-tap zoom & touch delay on mobile */
    button, canvas {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body class="bg-[#f4f4f9] text-gray-800 font-sans min-h-screen flex flex-col items-center p-3 sm:p-6">

  <div id="app" class="w-full max-w-4xl bg-white shadow-lg rounded-xl overflow-hidden border border-gray-200 min-h-[600px] flex flex-col justify-center">
    <!-- Content dynamically injected via JavaScript -->
  </div>

  <script>
    // --- Data & State ---
    const CATEGORY_DEFINITIONS = [
      { max_pumps: 128 },
      { max_pumps: 64 },
      { max_pumps: 32 }
    ];

    const COLOR_PALETTE = [
      { hex: "#1e88e5", name: "Blue", textDark: false },
      { hex: "#e53935", name: "Red", textDark: false },
      { hex: "#fdd835", name: "Yellow", textDark: true },
      { hex: "#8e24aa", name: "Purple", textDark: false },
      { hex: "#fb8c00", name: "Orange", textDark: true },
      { hex: "#00acc1", name: "Cyan", textDark: false },
      { hex: "#d81b60", name: "Pink", textDark: false }
    ];

    let state = {
      trials: [],
      totalTrials: 90,
      currentTrialIdx: 0,
      totalEarned: 0.0,
      lastBalloonEarned: 0.0,
      stats: {
        128: { pumps: [], popped_pumps: [], collected_pumps: [], pops: 0, collected: 0 },
        64:  { pumps: [], popped_pumps: [], collected_pumps: [], pops: 0, collected: 0 },
        32:  { pumps: [], popped_pumps: [], collected_pumps: [], pops: 0, collected: 0 }
      },
      currentCat: null,
      maxPumps: 0,
      explosionPoint: 0,
      currentPumps: 0,
      currentBank: 0.0,
      isPopping: false
    };

    const app = document.getElementById('app');

    // Utility: Shuffle Array
    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // Initialize session colors and trial sequence
    function initSession() {
      // Pick 3 distinct random colors
      const chosenColors = shuffle([...COLOR_PALETTE]).slice(0, 3);
      CATEGORY_DEFINITIONS.forEach((cat, idx) => {
        cat.color = chosenColors[idx].hex;
        cat.color_name = chosenColors[idx].name;
        cat.textDark = chosenColors[idx].textDark;
      });

      // Build 90 trials (30 per category)
      let trials = [];
      CATEGORY_DEFINITIONS.forEach(cat => {
        for (let i = 0; i < 30; i++) {
          trials.push({ ...cat });
        }
      });
      state.trials = shuffle(trials);
      state.totalTrials = state.trials.length;
      state.currentTrialIdx = 0;
      state.totalEarned = 0.0;
      state.lastBalloonEarned = 0.0;
      state.stats = {
        128: { pumps: [], popped_pumps: [], collected_pumps: [], pops: 0, collected: 0 },
        64:  { pumps: [], popped_pumps: [], collected_pumps: [], pops: 0, collected: 0 },
        32:  { pumps: [], popped_pumps: [], collected_pumps: [], pops: 0, collected: 0 }
      };

      showInstructionsScreen();
    }

    // --- Screen 1: Instructions ---
    function showInstructionsScreen() {
      app.innerHTML = `
        <div class="p-6 sm:p-10 flex flex-col justify-between h-full">
          <div>
            <h1 class="text-2xl sm:text-3xl font-bold text-center text-gray-800 mb-6">
              Welcome to the Balloon Analog Risk Task (BART)
            </h1>
            
            <div class="space-y-4 text-sm sm:text-base text-gray-700 leading-relaxed bg-gray-50 p-5 rounded-lg border border-gray-200">
              <p>In this task, you will be presented with a series of <strong>90 balloon trials</strong>.</p>
              
              <ul class="list-disc pl-5 space-y-2">
                <li>
                  <strong>Pump Up Balloon</strong>: Each pump earns you <strong>0.05 points</strong> into your temporary bank.<br>
                  <span class="text-xs sm:text-sm text-gray-500">Touch/Click button or press <strong>Space</strong>, <strong>Enter</strong>, or <strong>5</strong>.</span>
                </li>
                <li>
                  <strong>Collect Points</strong>: Click collect before the balloon pops to transfer your temporary earnings to your Total Bank.<br>
                  <span class="text-xs sm:text-sm text-gray-500">Touch/Click button or press <strong>C</strong>, <strong>V</strong>, or <strong>9</strong>.</span>
                </li>
                <li>
                  <strong>The Risk</strong>: Each balloon has a hidden explosion point. If the balloon pops, you lose the points accumulated in that trial.
                </li>
              </ul>
            </div>

            <p class="mt-6 text-sm italic text-gray-600 text-center">
              When you are ready, tap 'Start Task' below to begin.
            </p>
          </div>

          <div class="mt-8 text-center">
            <button id="btn-start" class="w-full sm:w-auto bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-10 rounded-lg text-lg shadow-md transition-all active:scale-95">
              Start Task
            </button>
          </div>
        </div>
      `;

      document.getElementById('btn-start').addEventListener('click', buildGameUIAndStart);
    }

    // --- Screen 2: Main Task Interface ---
    function buildGameUIAndStart() {
      app.innerHTML = `
        <div class="p-4 sm:p-6 flex flex-col h-full">
          <!-- Header -->
          <div class="text-center mb-4">
            <h2 class="text-xl sm:text-2xl font-bold text-gray-800">Balloon Analog Risk Task</h2>
            <div id="progress-label" class="text-xs sm:text-sm text-gray-500 font-medium mt-1">Trial 1 of 90</div>
          </div>

          <!-- Main Layout -->
          <div class="flex flex-col lg:flex-row gap-6 items-stretch justify-center flex-grow">
            <!-- Left Canvas & Controls Area -->
            <div class="flex-1 flex flex-col items-center justify-center bg-gray-50 p-4 rounded-xl border border-gray-200">
              <div class="relative w-full max-w-[360px] aspect-square flex items-center justify-center bg-white rounded-lg border border-gray-300 shadow-inner overflow-hidden mb-4">
                <canvas id="balloonCanvas" width="360" height="320" class="w-full h-full"></canvas>
              </div>

              <!-- Control Buttons -->
              <div class="grid grid-cols-2 gap-3 w-full max-w-[360px]">
                <button id="btn-pump" class="bg-green-600 hover:bg-green-700 active:bg-green-800 text-white font-bold py-3.5 px-2 rounded-lg text-sm sm:text-base shadow-md transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                  Pump Balloon<br><span class="text-[10px] sm:text-xs opacity-80">(Space / 5)</span>
                </button>
                <button id="btn-collect" class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3.5 px-2 rounded-lg text-sm sm:text-base shadow-md transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                  Collect Points<br><span class="text-[10px] sm:text-xs opacity-80">(C / V / 9)</span>
                </button>
              </div>
            </div>

            <!-- Right Scoreboard -->
            <div class="w-full lg:w-72 bg-[#e8e8ef] p-5 rounded-xl border-2 border-gray-300 flex flex-col justify-between">
              <div>
                <h3 class="text-lg font-bold text-gray-800 border-b border-gray-300 pb-2 mb-4">Scoreboard</h3>
                <div class="space-y-3">
                  <div>
                    <span class="text-xs text-gray-500 uppercase tracking-wider block">Current Trial</span>
                    <span id="lbl-temp-earned" class="text-lg font-semibold text-gray-800">0.00 Points</span>
                  </div>
                  <div>
                    <span class="text-xs text-gray-500 uppercase tracking-wider block">Last Balloon</span>
                    <span id="lbl-last-balloon" class="text-base font-medium text-gray-700">0.00 Points</span>
                  </div>
                </div>
              </div>

              <div class="mt-6 pt-4 border-t border-gray-300">
                <span class="text-xs text-gray-500 uppercase tracking-wider block">Total Bank</span>
                <span id="lbl-total-earned" class="text-2xl font-extrabold text-green-700">0.00 Points</span>
              </div>
            </div>
          </div>
        </div>
      `;

      // Event Listeners
      document.getElementById('btn-pump').addEventListener('click', pumpBalloon);
      document.getElementById('btn-collect').addEventListener('click', collectMoney);
      window.addEventListener('keydown', handleKeypress);

      loadNextTrial();
    }

    function handleKeypress(e) {
      if (state.currentTrialIdx >= state.totalTrials || state.isPopping) return;

      const key = e.key.toLowerCase();
      if ([' ', 'enter', '5'].includes(key)) {
        e.preventDefault();
        pumpBalloon();
      } else if (['c', 'v', '9'].includes(key)) {
        e.preventDefault();
        collectMoney();
      }
    }

    function loadNextTrial() {
      if (state.currentTrialIdx >= state.totalTrials) {
        showResultsScreen();
        return;
      }

      state.isPopping = false;
      state.currentCat = state.trials[state.currentTrialIdx];
      state.maxPumps = state.currentCat.max_pumps;
      state.explosionPoint = Math.floor(Math.random() * state.maxPumps) + 1;
      state.currentPumps = 0;
      state.currentBank = 0.0;

      document.getElementById('progress-label').innerText = `Trial ${state.currentTrialIdx + 1} of ${state.totalTrials}`;
      document.getElementById('lbl-temp-earned').innerText = `0.00 Points`;
      document.getElementById('lbl-last-balloon').innerText = `${state.lastBalloonEarned.toFixed(2)} Points`;
      document.getElementById('lbl-total-earned').innerText = `${state.totalEarned.toFixed(2)} Points`;

      setButtonsState(true);
      drawBalloon();
    }

    function drawBalloon() {
      const canvas = document.getElementById('balloonCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const baseRadius = 30;
      const radius = baseRadius + Math.floor(state.currentPumps * 1.4);
      const centerX = canvas.width / 2;
      const centerY = 140;
      const color = state.currentCat.color;

      // Draw String
      ctx.beginPath();
      ctx.moveTo(centerX, centerY + radius);
      ctx.lineTo(centerX, centerY + radius + 70);
      ctx.strokeStyle = "#666666";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Draw Oval Balloon
      ctx.beginPath();
      ctx.ellipse(centerX, centerY, radius, radius * 1.1, 0, 0, 2 * Math.PI);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = "#333333";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Draw Balloon Knot
      ctx.beginPath();
      ctx.moveTo(centerX - 6, centerY + (radius * 1.1));
      ctx.lineTo(centerX + 6, centerY + (radius * 1.1));
      ctx.lineTo(centerX, centerY + (radius * 1.1) + 8);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.stroke();
    }

    function pumpBalloon() {
      if (state.isPopping || state.currentTrialIdx >= state.totalTrials) return;

      state.currentPumps++;
      state.currentBank = state.currentPumps * 0.05;
      document.getElementById('lbl-temp-earned').innerText = `${state.currentBank.toFixed(2)} Points`;
      drawBalloon();

      if (state.currentPumps >= state.explosionPoint) {
        handleExplosion();
      }
    }

    function handleExplosion() {
      state.isPopping = true;
      const catKey = state.maxPumps;
      state.stats[catKey].pumps.push(state.currentPumps);
      state.stats[catKey].popped_pumps.push(state.currentPumps);
      state.stats[catKey].pops++;

      state.lastBalloonEarned = 0.0;
      setButtonsState(false);

      // Draw POP Text
      const canvas = document.getElementById('balloonCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.font = "bold 36px Arial";
      ctx.fillStyle = "#e53935";
      ctx.textAlign = "center";
      ctx.fillText("POP!", canvas.width / 2, canvas.height / 2);

      setTimeout(advanceTrial, 800);
    }

    function collectMoney() {
      if (state.isPopping || state.currentTrialIdx >= state.totalTrials) return;

      if (state.currentPumps === 0) {
        alert("You must pump the balloon at least once before collecting!");
        return;
      }

      const catKey = state.maxPumps;
      state.stats[catKey].pumps.push(state.currentPumps);
      state.stats[catKey].collected_pumps.push(state.currentPumps);
      state.stats[catKey].collected++;

      state.totalEarned += state.currentBank;
      state.lastBalloonEarned = state.currentBank;

      setButtonsState(false);
      advanceTrial();
    }

    function setButtonsState(enabled) {
      document.getElementById('btn-pump').disabled = !enabled;
      document.getElementById('btn-collect').disabled = !enabled;
    }

    function advanceTrial() {
      state.currentTrialIdx++;
      loadNextTrial();
    }

    // --- Screen 3: Results Dashboard ---
    function showResultsScreen() {
      window.removeEventListener('keydown', handleKeypress);

      let allPumps = [];
      let totalPops = 0;
      let totalCollected = 0;

      Object.keys(state.stats).forEach(k => {
        allPumps.push(...state.stats[k].pumps);
        totalPops += state.stats[k].pops;
        totalCollected += state.stats[k].collected;
      });

      const avgPumpsOverall = allPumps.length > 0 ? (allPumps.reduce((a, b) => a + b, 0) / allPumps.length) : 0;
      const maxPumpsOverall = allPumps.length > 0 ? Math.max(...allPumps) : 0;
      const minBlowUps = Math.min(...Object.keys(state.stats).map(k => state.stats[k].popped_pumps.length));

      app.innerHTML = `
        <div class="p-4 sm:p-6 overflow-y-auto max-h-[90vh]">
          <h2 class="text-xl sm:text-2xl font-bold text-center text-gray-800 mb-1">
            Experiment Complete - Results Dashboard
          </h2>
          <p class="text-center text-lg font-bold text-green-700 mb-4">
            Total Points Earned: ${state.totalEarned.toFixed(2)}
          </p>

          <!-- Aggregate Stats Banner -->
          <div class="bg-gray-100 border border-gray-300 rounded-lg p-3 sm:p-4 text-xs sm:text-sm text-gray-700 mb-5 leading-relaxed">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <div>• <strong>Average Pumps (Overall):</strong> ${avgPumpsOverall.toFixed(2)}</div>
              <div>• <strong>Balloons Collected:</strong> ${totalCollected} / ${state.totalTrials}</div>
              <div>• <strong>Highest Pump Count:</strong> ${maxPumpsOverall}</div>
              <div>• <strong>Min Pops (Category Low):</strong> ${minBlowUps}</div>
            </div>
          </div>

          <!-- Performance Breakdown Table -->
          <h3 class="text-sm font-bold text-gray-800 mb-2">Your Performance Breakdown:</h3>
          <div class="overflow-x-auto mb-6">
            <table class="w-full text-xs sm:text-sm border-collapse border border-gray-300 text-center">
              <thead>
                <tr class="bg-gray-200 text-gray-800">
                  <th class="border border-gray-300 p-2">Risk Level</th>
                  <th class="border border-gray-300 p-2">Assigned Color</th>
                  <th class="border border-gray-300 p-2">Pops / Collected</th>
                  <th class="border border-gray-300 p-2">Avg Popped Pump</th>
                  <th class="border border-gray-300 p-2">Avg Collected Pump</th>
                </tr>
              </thead>
              <tbody>
                ${[128, 64, 32].map(maxP => {
                  const catData = state.stats[maxP];
                  const catDef = CATEGORY_DEFINITIONS.find(c => c.max_pumps === maxP);
                  const poppedAvg = catData.popped_pumps.length ? (catData.popped_pumps.reduce((a,b)=>a+b,0)/catData.popped_pumps.length).toFixed(2) : "0.00";
                  const collectedAvg = catData.collected_pumps.length ? (catData.collected_pumps.reduce((a,b)=>a+b,0)/catData.collected_pumps.length).toFixed(2) : "0.00";
                  const textColor = catDef.textDark ? "text-gray-900" : "text-white";

                  return `
                    <tr class="hover:bg-gray-50">
                      <td class="border border-gray-300 p-2 font-medium">1/${maxP} Risk</td>
                      <td class="border border-gray-300 p-2 font-semibold ${textColor}" style="background-color: ${catDef.color}">
                        ${catDef.color_name} (${catDef.color})
                      </td>
                      <td class="border border-gray-300 p-2">${catData.pops} pops / ${catData.collected} collected</td>
                      <td class="border border-gray-300 p-2">${poppedAvg}</td>
                      <td class="border border-gray-300 p-2">${collectedAvg}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>

          <!-- Normative Comparison Table -->
          <h3 class="text-sm font-bold text-gray-800 mb-2">Normative Comparison (Lejuez et al., 2002 Table 1 Norms):</h3>
          <div class="overflow-x-auto mb-4">
            <table class="w-full text-[11px] sm:text-xs border-collapse border border-gray-300 text-center">
              <thead>
                <tr class="bg-blue-100 text-gray-800">
                  <th class="border border-gray-300 p-1.5">Norm Category</th>
                  <th class="border border-gray-300 p-1.5">Total Avg Pumps (M ± SD)</th>
                  <th class="border border-gray-300 p-1.5">Adjusted Avg Pumps (M ± SD)</th>
                  <th class="border border-gray-300 p-1.5">Explosions (M ± SD)</th>
                </tr>
              </thead>
              <tbody class="bg-white">
                <tr><td class="border border-gray-300 p-1.5 text-left font-medium">Blue (1-128) - Men</td><td class="border border-gray-300 p-1.5">30.5 ± 10.1</td><td class="border border-gray-300 p-1.5">33.3 ± 13.2</td><td class="border border-gray-300 p-1.5">9.1 ± 4.5</td></tr>
                <tr><td class="border border-gray-300 p-1.5 text-left font-medium">Blue (1-128) - Women</td><td class="border border-gray-300 p-1.5">25.0 ± 9.6</td><td class="border border-gray-300 p-1.5">25.5 ± 11.5</td><td class="border border-gray-300 p-1.5">7.6 ± 4.5</td></tr>
                <tr><td class="border border-gray-300 p-1.5 text-left font-medium">Yellow (1-32) - Men</td><td class="border border-gray-300 p-1.5">11.1 ± 2.6</td><td class="border border-gray-300 p-1.5">12.3 ± 3.8</td><td class="border border-gray-300 p-1.5">16.5 ± 5.1</td></tr>
                <tr><td class="border border-gray-300 p-1.5 text-left font-medium">Yellow (1-32) - Women</td><td class="border border-gray-300 p-1.5">10.3 ± 2.5</td><td class="border border-gray-300 p-1.5">11.4 ± 3.8</td><td class="border border-gray-300 p-1.5">15.0 ± 4.5</td></tr>
                <tr><td class="border border-gray-300 p-1.5 text-left font-medium">Orange (1-8) - Men</td><td class="border border-gray-300 p-1.5">3.6 ± 0.6</td><td class="border border-gray-300 p-1.5">3.5 ± 1.1</td><td class="border border-gray-300 p-1.5">22.2 ± 4.5</td></tr>
                <tr><td class="border border-gray-300 p-1.5 text-left font-medium">Orange (1-8) - Women</td><td class="border border-gray-300 p-1.5">3.6 ± 0.6</td><td class="border border-gray-300 p-1.5">3.5 ± 1.0</td><td class="border border-gray-300 p-1.5">21.7 ± 4.0</td></tr>
              </tbody>
            </table>
          </div>

          <!-- Citation -->
          <p class="text-[10px] sm:text-xs text-gray-500 italic mb-6 leading-tight">
            <strong>Citation:</strong> Lejuez, C. W., Read, J. P., Kahler, C. W., Richards, J. B., Ramsey, S. E., Stuart, G. L., Strong, D. R., & Brown, R. A. (2002). Evaluation of a behavioral measure of risk taking: the Balloon Analogue Risk Task (BART). <em>Journal of Experimental Psychology: Applied</em>, 8(2), 75–84. https://doi.org/10.1037//1076-898x.8.2.75
          </p>

          <div class="text-center">
            <button id="btn-restart" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-6 rounded-lg text-sm shadow-md transition-all active:scale-95">
              Restart Task
            </button>
          </div>
        </div>
      `;

      document.getElementById('btn-restart').addEventListener('click', initSession);
    }

    // Launch Application on Load
    window.addEventListener('DOMContentLoaded', initSession);
  </script>
</body>
</html>
